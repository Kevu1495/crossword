name: Replenish reviewed puzzles
on:
  workflow_dispatch:
  schedule:
    - cron: '23 4 * * *'
permissions:
  contents: read
concurrency:
  group: puzzle-generation
  cancel-in-progress: false
jobs:
  generate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python3 -m unittest discover -s generator/tests -v
      - name: Generate reviewed puzzles
        id: batch
        run: |
          python3 generator/batch.py --count 2 --allow-empty
          python3 -c 'import json, os; puzzles=json.load(open("generator/datasets/batch.json")); open(os.environ["GITHUB_OUTPUT"], "a").write(f"count={len(puzzles)}\n"); open(os.environ["GITHUB_STEP_SUMMARY"], "a").write(f"Generated {len(puzzles)} new reviewed puzzles.\n" + ("No additions: expand the approved clue bank to replenish inventory. Existing puzzles are unchanged.\n" if not puzzles else ""))'
      - uses: actions/upload-artifact@v4
        with:
          name: reviewed-puzzle-batch
          path: |
            generator/datasets/batch.json
            generator/datasets/batch.sql
      - name: Publish with configured D1 credentials
        if: steps.batch.outputs.count != '0'
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_DATABASE_ID: ${{ secrets.CLOUDFLARE_DATABASE_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ] && [ -n "$CLOUDFLARE_DATABASE_ID" ]; then
            python3 scripts/publish_batch.py generator/datasets/batch.sql
          else
            echo 'Batch saved as artifact. Add D1 secrets to enable publication.'
          fi
